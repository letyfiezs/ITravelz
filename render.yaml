services:
  # ── Single Web Service: backend serves the built React frontend ────────
  - type: web
    name: itravelmongolia
    env: node
    # Build React app, then install backend deps
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production

      # Required — set in the Render dashboard
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        sync: false # Long random secret
      - key: JWT_EXPIRE
        value: 7d
      - key: SESSION_SECRET
        sync: false # Long random secret for express-session

      # Set to your Render service URL once deployed (e.g. https://itravelmongolia.onrender.com)
      # ⚠ If frontend is on Vercel instead, change this to your Vercel URL
      - key: CLIENT_URL
        value: https://itravelz-2.onrender.com
      - key: FRONTEND_URL
        value: https://itravelz-2.onrender.com
      # Used by passport.js callback fallback
      - key: BACKEND_URL
        value: https://itravelz-2.onrender.com

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://itravelz-2.onrender.com/api/auth/google/callback

      # Optional — email / SMTP
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

      # Cloudinary (image uploads)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Brevo (Sendinblue) — email provider
      - key: BREVO_API_KEY
        sync: false # Brevo дансны API key
      - key: FROM_EMAIL
        sync: false # Имэйл илгээгч хаяг (e.g. info@itravelmongolia.mn)
      - key: FROM_NAME
        sync: false # Илгээгч нэр (e.g. Itravelmongolia)
      - key: ADMIN_EMAIL
        sync: false # Admin email for notifications

      # Frontend build-time API URL (relative = same service, no CORS)
      - key: VITE_API_URL
        value: /api

      # Stripe payment
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
